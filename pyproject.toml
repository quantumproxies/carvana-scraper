[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-carvana-scraper"
version = "0.1.0"
description = "Carvana scraper for Python and the command line: used-car inventory by make and model with price, previous price, MSRP, Kelley Blue Book value, mileage, VIN, trim, colours and stock number, as JSON or CSV. Free and open source; sign in with your QuanticData account, no proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["carvana-scraper", "carvana", "carvana-api", "used-cars", "car-listings", "car-prices", "vehicle-data", "vin", "automotive", "price-tracker", "web-scraping", "scraper"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
carvana-scraper = "quanticdata_carvana_scraper.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/carvana-scraper-api/?utm_source=github&utm_medium=pypi&utm_campaign=carvana-scraper"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/carvana-scraper"
Issues = "https://github.com/quantumproxies/carvana-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_carvana_scraper" = ["spec.json", "py.typed"]
